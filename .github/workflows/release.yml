name: Release

# Construit des exécutables autonomes. Déclenché par une étiquette de version (v0.1.0) ou à la main.
# Les tests (3 systèmes) doivent passer avant tout build. Droits minimaux : écriture uniquement
# dans le job « publish » ; les jobs de build n'ont que la lecture + l'attestation de provenance.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.name }}
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write         # attestation de provenance (Sigstore)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04 }     # glibc 2.35 : compatible avec la plupart des distributions récentes
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"        # pas de cache pip : build de release reproductible et non empoisonnable

      - name: Vérifier que l'étiquette correspond à la version du code
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/mail_archive_explorer/__init__.py').read_text()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$(echo "$TAG" | tr -d '-')" = "$VERSION" ] || { echo "Étiquette $GITHUB_REF_NAME != version du code $VERSION"; exit 1; }

      - name: Bibliothèques système Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxcursor1 libxi6 libfontconfig1 libasound2

      - name: Installation (versions exactes ; l'application elle-même sans résolution de dépendances)
        shell: bash
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps -e .

      - name: PyInstaller
        working-directory: packaging
        run: pyinstaller --noconfirm --distpath ../build/dist --workpath ../build/work mail_archive_explorer.spec

      - name: Auto-test de l'application PACKAGÉE (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
          MAE_SELFTEST_OUT: selftest.txt
        run: |
          ./build/dist/MailArchiveExplorer/MailArchiveExplorer --selftest || true
          cat selftest.txt
          grep -q "SELFTEST OK" selftest.txt

      - name: Auto-test de l'application PACKAGÉE (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MAE_SELFTEST_OUT: selftest.txt
        run: |
          ./build/dist/MailArchiveExplorer/MailArchiveExplorer.exe --selftest || true
          cat selftest.txt
          grep -q "SELFTEST OK" selftest.txt

      - name: Auto-test de l'application PACKAGÉE (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          MAE_SELFTEST_OUT: selftest.txt
        run: |
          ./build/dist/MailArchiveExplorer.app/Contents/MacOS/MailArchiveExplorer --selftest || true
          cat selftest.txt
          grep -q "SELFTEST OK" selftest.txt

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf MailArchiveExplorer-${{ matrix.name }}.tar.gz -C build/dist MailArchiveExplorer

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/dist/MailArchiveExplorer -DestinationPath MailArchiveExplorer-${{ matrix.name }}.zip

      - name: Image disque (macOS)
        if: runner.os == 'macOS'
        run: hdiutil create -volname "Mail Archive Explorer" -srcfolder build/dist/MailArchiveExplorer.app -ov -format UDZO MailArchiveExplorer-${{ matrix.name }}.dmg

      - name: Attestation de provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            MailArchiveExplorer-${{ matrix.name }}.zip
            MailArchiveExplorer-${{ matrix.name }}.dmg
            MailArchiveExplorer-${{ matrix.name }}.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MailArchiveExplorer-${{ matrix.name }}
          path: |
            MailArchiveExplorer-${{ matrix.name }}.zip
            MailArchiveExplorer-${{ matrix.name }}.dmg
            MailArchiveExplorer-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publier la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write         # seul job autorisé à écrire dans le dépôt
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
