name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # réutilisé par release.yml : pas de release sans tests verts

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Bibliothèques système Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxcursor1 libxi6 libfontconfig1 libasound2t64

      - name: Installation
        run: python -m pip install -e ".[dev]"

      - name: Jeux de test PST publics (vérifiés par SHA-256, non redistribués)
        shell: bash
        run: |
          mkdir -p tests/fixtures/private && cd tests/fixtures/private
          get() { curl -fsSL "$1" -o "$2" && echo "$3  $2" > "$2.sha" && (sha256sum -c "$2.sha" 2>/dev/null || shasum -a 256 -c "$2.sha") && rm "$2.sha"; }
          get https://raw.githubusercontent.com/rjohnsondev/java-libpst/develop/src/test/resources/dist-list.pst dist-list.pst c86841da106036b5abe5a2141dc7644cbb2bf8b504873515eb35a2efeb8c28ac
          get https://raw.githubusercontent.com/rjohnsondev/java-libpst/develop/src/test/resources/example-2013.ost example-2013.ost b18ff390d0c22273029ee580ab6025976af69a4f84e276d1b1c01a988650853d
          get https://raw.githubusercontent.com/apache/tika/main/tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-microsoft-module/src/test/resources/test-documents/testPST.pst tika_testPST.pst f2a6b1d2cad00f574e3d1c1211c4b1c854d6526caea77213adc3da92b7813ae3

      - name: "Tests (le test OLM est sauté, l'archive est privée)"
        run: python -m pytest -q

      - name: Auto-test (pypff, FTS5, import, WebEngine)
        shell: bash
        run: MAE_SELFTEST_OUT=selftest.txt python -m mail_archive_explorer --selftest; cat selftest.txt
