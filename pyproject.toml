[project]
name = "mail-archive-explorer"
dynamic = ["version"]
description = "Consultation et recherche locales d'archives PST, MBOX, EML"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.7,<7", "libpff-python==20261030"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mail-archive-explorer = "mail_archive_explorer.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "mail_archive_explorer.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
